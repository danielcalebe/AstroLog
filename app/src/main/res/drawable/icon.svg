<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- DEFINIÇÃO DE GRADIENTES PARA COERÊNCIA VISUAL -->
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0E27" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#F5682A"/>
    </linearGradient>
  </defs>

  <!-- FUNDO DO ÍCONE (Fundo oficial escuro para o Canvas do App) -->
  <rect width="512" height="512" rx="112" fill="#0A0E27" stroke="#1E2D6B" stroke-width="8"/>

  <!-- GRUPO DO SÍMBOLO CENTRALIZADO -->
  <g transform="translate(56, 56)">
    <!-- BRILHO DE ATMOSFERA SUTIL -->
    <circle cx="200" cy="200" r="160" fill="url(#skyGlow)" />

    <!-- ESTRUTURA BASE: LENTE DO TELESCÓPIO / ÓRBITA -->
    <!-- Anel Externo Tracejado -->
    <circle cx="200" cy="200" r="120" fill="none" stroke="#1E2D6B" stroke-width="6" stroke-dasharray="15 10" />
    
    <!-- Corpo Principal da Lente -->
    <circle cx="200" cy="200" r="95" fill="#0A0E27" stroke="#4ECDC4" stroke-width="4" />

    <!-- A ÓRBITA DINÂMICA -->
    <path d="M 70 240 C 100 120, 300 100, 330 200 C 345 250, 290 310, 200 310" 
          fill="none" stroke="url(#orbitGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- ELEMENTO CENTRAL: A ESTRELA DE QUATRO PONTAS -->
    <!-- Brilho de Fundo da Estrela -->
    <circle cx="200" cy="200" r="25" fill="#FFB347" opacity="0.4" />
    <!-- Corpo da Estrela -->
    <path d="M 200 165 Q 200 200, 235 200 Q 200 200, 200 235 Q 200 200, 165 200 Q 200 200, 200 165 Z" 
          fill="#F4F6FF" />
    <!-- Núcleo de Foco -->
    <circle cx="200" cy="200" r="5" fill="#4ECDC4" />

    <!-- ELEMENTOS COMPLEMENTARES -->
    <circle cx="150" cy="140" r="4" fill="#F4F6FF" opacity="0.8" />
    <circle cx="260" cy="130" r="3" fill="#F4F6FF" opacity="0.6" />
    <circle cx="280" cy="250" r="5" fill="#4ECDC4" opacity="0.9" />
    <!-- Linha guia de medição astronômica -->
    <line x1="150" y1="140" x2="165" y2="200" stroke="#1E2D6B" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>
</svg>
